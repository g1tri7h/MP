<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4D 开奖图片生成器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:#eee;font-family:Arial,sans-serif}
.app{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:26px}
.panel{width:360px;background:#181818;border:1px solid #383838;border-radius:18px;padding:20px}
h2{margin:0 0 18px;font-size:21px} .tip{font-size:13px;line-height:1.6;color:#aaa;margin-bottom:16px}
label{display:block;margin:13px 0 7px;font-size:13px;color:#bbb;font-weight:700}
input[type=file],input[type=text]{width:100%}
input[type=text]{height:44px;background:#101010;border:1px solid #444;border-radius:9px;color:#fff;padding:0 12px;font-size:16px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.five input{min-width:0;text-align:center;padding:0 3px;height:40px;font-size:14px}
.num{
 min-width:0!important;
 text-align:center!important;
 padding:0 3px!important;
 height:40px!important;
 font-size:14px!important;
 background:#101010!important;
 border:1px solid #444!important;
 border-radius:9px!important;
 color:#fff!important;
 font-weight:700!important;
 -webkit-appearance:none;
 appearance:none;
}
.num::placeholder{color:#777;opacity:1}
.topPrizeInputs{grid-template-columns:repeat(3,1fr)}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer}
.download{background:#fff;color:#111} .clear{background:#292929;color:#fff}
.preview{width:min(720px,calc(100vw - 430px));display:flex;justify-content:center}
#poster{display:block;width:100%;height:auto;aspect-ratio:3/4;background:#202020}
@media(max-width:900px){.app{display:block;padding:12px}.panel{width:100%;margin-bottom:16px}.preview{width:100%}}
</style>
</head>
<body>
<div class="app">
 <div class="panel">
  <h2>4D 开奖图片生成器</h2>
  <div class="tip">固定 1080 × 1440 Canvas。数字字形已直接内置，不调用手机或电脑系统字体；iPhone 下载使用系统分享/保存流程。</div>
  <label>更换背景图（可选，默认使用预设背景）</label><input id="bgUpload" type="file" accept="image/*">
  <label>头奖 / 二奖 / 三奖号码</label>
  <div class="five topPrizeInputs"><input type="text" class="num" data-key="first" maxlength="4" inputmode="numeric" placeholder="0000"><input type="text" class="num" data-key="second" maxlength="4" inputmode="numeric" placeholder="0000"><input type="text" class="num" data-key="third" maxlength="4" inputmode="numeric" placeholder="0000"></div>
  <label>入围奖 × 10</label><div class="five" id="specialInputs"></div>
  <label>安慰奖 × 10</label><div class="five" id="consolationInputs"></div>
  <button class="download" id="download">DOWNLOAD PNG</button>
  <button class="clear" id="clear">CLEAR NUMBERS</button>
 </div>
 <div class="preview"><canvas id="poster" width="1080" height="1440"></canvas></div>
</div>

const canvas=document.getElementById('poster'),ctx=canvas.getContext('2d');
const values={first:'',second:'',third:'',special:Array(10).fill(''),consolation:Array(10).fill('')};
let bg=new Image();

function makeInputs(boxId,type){
 const box=document.getElementById(boxId);
 for(let i=0;i<10;i++){
   const x=document.createElement('input'); x.type='text';x.maxLength=4;x.inputMode='numeric';x.placeholder='0000';
   x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,4);values[type][i]=x.value;render();});
   box.appendChild(x);
 }
}
makeInputs('specialInputs','special'); makeInputs('consolationInputs','consolation');


document.querySelectorAll('.num').forEach(x=>x.addEventListener('input',()=>{
 x.value=x.value.replace(/\D/g,'').slice(0,4);
 values[x.dataset.key]=x.value;
 render();
}));




// One auto-next rule for every number box.
// keyup is intentionally used here so the top 3's own input sanitizer
// finishes first before we check for 4 digits.
document.addEventListener('keyup', function(e){
  const current=e.target;
  if(!current.matches('input[type="text"]')) return;
  if(current.value.length !== 4) return;

  const inputs=Array.from(document.querySelectorAll('input[type="text"]'));
  const i=inputs.indexOf(current);
  if(i !== -1 && i < inputs.length-1){
    inputs[i+1].focus();
  }
}, true);

// Mobile/iPhone fallback for numeric keyboards where keyup can be inconsistent.
let lastAutoNextEl=null;
document.addEventListener('input', function(e){
  const current=e.target;
  if(!current.matches('input[type="text"]')) return;

  setTimeout(function(){
    if(current.value.length !== 4 || lastAutoNextEl===current) return;
    const inputs=Array.from(document.querySelectorAll('input[type="text"]'));
    const i=inputs.indexOf(current);
    if(i !== -1 && i < inputs.length-1){
      lastAutoNextEl=current;
      inputs[i+1].focus();
      setTimeout(function(){ lastAutoNextEl=null; }, 120);
    }
  }, 20);
}, false);

function cover(img){
 const W=1080,H=1440,ir=img.width/img.height,cr=W/H;
 let sx=0,sy=0,sw=img.width,sh=img.height;
 if(ir>cr){sw=sh*cr;sx=(img.width-sw)/2}else{sh=sw/cr;sy=(img.height-sh)/2}

 const w=size*ratio;
 const total=text.length*w + Math.max(0,text.length-1)*spacing;
 let left=x-total/2;
 for(const ch of text){
   const im=DIGIT_IMGS[ch];
   if(im && im.complete) ctx.drawImage(im,left,y-size/2,w,size);
   left += w+spacing;
 }
}

// All coordinates are fixed in the 1080×1440 design coordinate system.
// They are aligned directly to the number boxes in the preset artwork.
const P={
 first:[540,386,82,10],
 second:[299,546,76,9],
 third:[787,546,76,9],
 special:[
  [171,746],[360,746],[550,746],[739,746],[929,746],
  [171,858],[360,858],[550,858],[739,858],[929,858]
 ],
 consolation:[
  [171,1059],[360,1059],[550,1059],[739,1059],[929,1059],
  [171,1171],[360,1171],[550,1171],[739,1171],[929,1171]
 ]
};

function render(){
 ctx.clearRect(0,0,1080,1440);
 ctx.fillStyle='#202020';ctx.fillRect(0,0,1080,1440);
 if(bg && bg.complete && bg.naturalWidth)cover(bg);
 gold(values.first,...P.first);gold(values.second,...P.second);gold(values.third,...P.third);
 P.special.forEach((p,i)=>gold(values.special[i],p[0],p[1],48,4));
 P.consolation.forEach((p,i)=>gold(values.consolation[i],p[0],p[1],48,4));
}

bg.onload=render; bg.src=PRESET;

document.getElementById('bgUpload').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const n=new Image();n.onload=()=>{bg=n;render()};n.src=r.result};r.readAsDataURL(f);
});
document.getElementById('clear').onclick=()=>{
 values.first=values.second=values.third='';values.special.fill('');values.consolation.fill('');
 document.querySelectorAll('input[type=text]').forEach(x=>x.value='');render();
};

document.getElementById('download').onclick=async()=> {
 render();
 canvas.toBlob(async(blob)=>{
   if(!blob){ alert('PNG generation failed.'); return; }
   const file=new File([blob],'lottery-result.png',{type:'image/png'});
   // iPhone/iPad: use native share sheet when available, so "Save Image" works reliably.
   if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
     try{ await navigator.share({files:[file],title:'Lottery Result'}); return; }
     catch(e){ if(e && e.name==='AbortError') return; }
   }
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url; a.download='lottery-result.png';
   document.body.appendChild(a); a.click(); a.remove();
   // Safari fallback: if download attribute is ignored, open the PNG itself.
   if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
     setTimeout(()=>window.open(url,'_blank'),120);
   }
   setTimeout(()=>URL.revokeObjectURL(url),15000);
 },'image/png');
};
</script>
