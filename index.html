<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4D 开奖图片生成器</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0c0c0c;color:#eee;font-family:Arial,sans-serif}
.app{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:26px}
.panel{width:360px;background:#181818;border:1px solid #383838;border-radius:18px;padding:20px}
h2{margin:0 0 18px;font-size:21px} .tip{font-size:13px;line-height:1.6;color:#aaa;margin-bottom:16px}
label{display:block;margin:13px 0 7px;font-size:13px;color:#bbb;font-weight:700}
input[type=file],input[type=text]{width:100%}
input[type=text]{height:44px;background:#101010;border:1px solid #444;border-radius:9px;color:#fff;padding:0 12px;font-size:16px;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.five input{min-width:0;text-align:center;padding:0 3px;height:40px;font-size:14px}
button{width:100%;height:48px;margin-top:12px;border:0;border-radius:10px;font-weight:900;font-size:15px;cursor:pointer}
.download{background:#fff;color:#111} .clear{background:#292929;color:#fff}
.preview{width:min(720px,calc(100vw - 430px));display:flex;justify-content:center}
#poster{display:block;width:100%;height:auto;aspect-ratio:3/4;background:#202020}
@media(max-width:900px){.app{display:block;padding:12px}.panel{width:100%;margin-bottom:16px}.preview{width:100%}}
</style>
</head>
<body>
<div class="app">
 <div class="panel">
  <h2>4D 开奖图片生成器</h2>
  <div class="tip">固定 1080 × 1440 Canvas。恢复原版粗体数字风格；号码坐标与字距仍由同一 Canvas 固定。</div>
  <label>更换背景图（可选，默认使用预设背景）</label><input id="bgUpload" type="file" accept="image/*">
  <label>头奖 / 二奖 / 三奖号码</label>
  <input class="num" data-key="first" maxlength="4" inputmode="numeric" placeholder="0000">
  <div class="two"><input class="num" data-key="second" maxlength="4" inputmode="numeric" placeholder="0000"><input class="num" data-key="third" maxlength="4" inputmode="numeric" placeholder="0000"></div>
  <label>入围奖 × 10</label><div class="five" id="specialInputs"></div>
  <label>安慰奖 × 10</label><div class="five" id="consolationInputs"></div>
  <button class="download" id="download">DOWNLOAD PNG</button>
  <button class="clear" id="clear">CLEAR NUMBERS</button>
 </div>
 <div class="preview"><canvas id="poster" width="1080" height="1440"></canvas></div>
</div>

const canvas=document.getElementById('poster'),ctx=canvas.getContext('2d');
const values={first:'',second:'',third:'',special:Array(10).fill(''),consolation:Array(10).fill('')};
let bg=new Image();

function makeInputs(boxId,type){
 const box=document.getElementById(boxId);
 for(let i=0;i<10;i++){
   const x=document.createElement('input'); x.type='text';x.maxLength=4;x.inputMode='numeric';x.placeholder='0000';
   x.addEventListener('input',()=>{x.value=x.value.replace(/\D/g,'').slice(0,4);values[type][i]=x.value;render();});
   box.appendChild(x);
 }
}
makeInputs('specialInputs','special'); makeInputs('consolationInputs','consolation');

document.querySelectorAll('.num').forEach(x=>x.addEventListener('input',()=>{
 x.value=x.value.replace(/\D/g,'').slice(0,4);values[x.dataset.key]=x.value;render();
}));

function cover(img){
 const W=1080,H=1440,ir=img.width/img.height,cr=W/H;
 let sx=0,sy=0,sw=img.width,sh=img.height;
 if(ir>cr){sw=sh*cr;sx=(img.width-sw)/2}else{sh=sw/cr;sy=(img.height-sh)/2}
 ctx.drawImage(img,sx,sy,sw,sh,0,0,W,H);
}

function spacedWidth(text,font,spacing){
 ctx.font=font;
 const a=[...text]; return a.reduce((s,c)=>s+ctx.measureText(c).width,0)+Math.max(0,a.length-1)*spacing;
}
function drawSpaced(text,x,y,font,spacing,mode){
 const chars=[...text], total=spacedWidth(text,font,spacing); let p=x-total/2;
 chars.forEach(c=>{const w=ctx.measureText(c).width; mode(c,p+w/2,y);p+=w+spacing;});
}
function gold(text,x,y,size,spacing){
 if(!text)return;
 ctx.save();
 const font=`900 ${size}px "Arial Black", Arial, Helvetica, sans-serif`;
 ctx.font=font;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';

 // restrained depth
 ctx.fillStyle='rgba(105,61,5,.62)';
 drawSpaced(text,x,y+2,font,spacing,(c,cx,cy)=>ctx.fillText(c,cx,cy));

 const g=ctx.createLinearGradient(0,y-size*.55,0,y+size*.55);
 g.addColorStop(0,'#fff0a2');g.addColorStop(.30,'#f5d466');g.addColorStop(.60,'#d7a02c');g.addColorStop(1,'#efc54d');
 ctx.fillStyle=g;ctx.strokeStyle='rgba(98,58,7,.70)';ctx.lineWidth=Math.max(1,size*.012);
 ctx.shadowColor='rgba(0,0,0,.24)';ctx.shadowBlur=Math.max(2,size*.025);ctx.shadowOffsetY=1;
 drawSpaced(text,x,y,font,spacing,(c,cx,cy)=>{ctx.strokeText(c,cx,cy);ctx.fillText(c,cx,cy);});
 ctx.restore();
}

 ctx.fillStyle='#202020';ctx.fillRect(0,0,1080,1440);
 if(bg && bg.complete && bg.naturalWidth)cover(bg);
 gold(values.first,...P.first);gold(values.second,...P.second);gold(values.third,...P.third);
 P.special.forEach((p,i)=>gold(values.special[i],p[0],p[1],48,4));
 P.consolation.forEach((p,i)=>gold(values.consolation[i],p[0],p[1],48,4));
}

bg.onload=render; bg.src=PRESET;

document.getElementById('bgUpload').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const n=new Image();n.onload=()=>{bg=n;render()};n.src=r.result};r.readAsDataURL(f);
});
document.getElementById('clear').onclick=()=>{
 values.first=values.second=values.third='';values.special.fill('');values.consolation.fill('');
 document.querySelectorAll('input[type=text]').forEach(x=>x.value='');render();
};
document.getElementById('download').onclick=()=>{
 render();const a=document.createElement('a');a.download='lottery-result.png';a.href=canvas.toDataURL('image/png');a.click();
};
